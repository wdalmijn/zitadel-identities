name: Deploy superbusy.work

on:
  push:
    branches: [main]
    paths:
      - "domains/superbusy.work/**"
      - ".github/workflows/pages-superbusy-work.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Package the domain folder ourselves: actions/upload-pages-artifact
      # skips dot-folders, which would drop .well-known.
      - name: Package site
        run: tar --dereference --hard-dereference -cvf "$RUNNER_TEMP/artifact.tar" -C domains/superbusy.work .

      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
